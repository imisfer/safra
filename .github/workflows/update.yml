name: Update match data

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch: {}       # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch data from API-Football
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: node scripts/update.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "safra-bot"
          git config user.email "safra-bot@users.noreply.github.com"
          git add data.json missing-names.txt
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update match data $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
